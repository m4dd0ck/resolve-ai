[project]
name = "resolve-ai"
version = "0.1.0"
description = "LLM-Augmented Entity Resolution and Data Enrichment"
readme = "README.md"
authors = [
    { name = "m4dd0ck", email = "noahmaddock1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rapidfuzz>=3.9.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
resolve = "resolve_ai.cli:app"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
]
